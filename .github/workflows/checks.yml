name: Homepage browser checks
on:
  pull_request:
    paths: ['index.html', 'style.css', 'script.js', 'assets/**', 'tests/**', 'package.json', '.github/workflows/checks.yml']
  push:
    branches: ['codex/homepage-refresh-20261010']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homepage-browser-preview
          path: .test-artifacts/
